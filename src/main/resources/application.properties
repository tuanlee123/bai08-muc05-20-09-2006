# 1. Cổng chạy ứng dụng và Context Path
server.port=8086
server.servlet.context-path=/BAI4

# 2. View Resolver cho JSP đã được cấu hình trong WebMvcConfig.java (Order = 2)
# Khong de spring.mvc.view o day de tranh nuot mat view cua Thymeleaf

# 3. Kết nối CSDL SQL Server
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=ShoppingServiceMVC;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 4. Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 5. GIỮ NGUYÊN TÊN CỘT TRONG MODEL (Khắc phục lỗi Invalid column name 'category_id')
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# 6. Cấu hình dung lượng upload ảnh
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# 7. Thư mục lưu file vật lý cục bộ
app.upload.dir=C:/upload/

# 8. GraphQL Configuration & GraphiQL Tool (Slide 14 Thầy Trung)
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS

# 9. Cấu hình Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML