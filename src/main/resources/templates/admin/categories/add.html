<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Thêm Danh Mục Mới</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card border-0 shadow-sm col-md-8 mx-auto">
        <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-folder-plus me-2"></i>Thêm Mới Danh Mục</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/category/add}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên Danh Mục:</label>
                    <input type="text" name="categoryname" class="form-control" required placeholder="Nhập tên danh mục...">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Hình Ảnh:</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Trạng Thái:</label>
                    <select name="status" class="form-select">
                        <option value="1">Hoạt động</option>
                        <option value="0">Khóa</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/admin/categories}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Lưu danh mục</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
