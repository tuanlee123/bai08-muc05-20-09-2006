<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Chỉnh Sửa Danh Mục</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card border-0 shadow-sm col-md-8 mx-auto">
        <div class="card-header bg-warning text-dark py-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Cập Nhật Danh Mục</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/category/edit}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="categoryId" th:value="${category.categoryId}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Tên Danh Mục:</label>
                    <input type="text" name="categoryname" th:value="${category.categoryname}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold d-block">Hình Ảnh Hiện Tại:</label>
                    <img th:src="${category.images != null && category.images.startsWith('http')} ? ${category.images} : @{'/image?fname=' + ${category.images}}" 
                         class="rounded border mb-2" style="width: 80px; height: 80px; object-fit: cover;"
                         onerror="this.src='https://placehold.co/80x80?text=No+Img'">
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Trạng Thái:</label>
                    <select name="status" class="form-select">
                        <option value="1" th:selected="${category.status == 1}">Hoạt động</option>
                        <option value="0" th:selected="${category.status == 0}">Khóa</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/admin/categories}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-warning"><i class="bi bi-check2-circle me-1"></i> Cập nhật</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
