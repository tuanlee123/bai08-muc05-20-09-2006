<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GraphiQL IDE</title>
    <style>
        body { height: 100vh; margin: 0; overflow: hidden; }
        #graphiql { height: 100vh; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/graphiql@2.4.7/graphiql.min.css" />
</head>
<body>
    <div id="graphiql"></div>

    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/graphiql@2.4.7/graphiql.min.js"></script>

    <script th:inline="javascript">
        const fetcher = GraphiQL.createFetcher({
            url: /*[[@{/graphql}]]*/ '/BAI4/graphql',
        });

        const defaultQuery = `query {
  productsPriceAsc {
    productId
    productName
    price
    category {
      categoryname
    }
  }
}`;

        ReactDOM.render(
            React.createElement(GraphiQL, {
                fetcher: fetcher,
                defaultQuery: defaultQuery
            }),
            document.getElementById('graphiql')
        );
    </script>
</body>
</html>
