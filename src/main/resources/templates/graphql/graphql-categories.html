<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Category - GraphQL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        .table > tbody > tr > td { vertical-align: middle; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/graphql/home}">
            <i class="bi bi-diagram-3-fill me-2"></i> GRAPHQL ADMIN
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/graphql/home}"><i class="bi bi-house me-1"></i> Trang Chủ</a>
            <a class="nav-link active" th:href="@{/graphql/categories}"><i class="bi bi-folder2-open me-1"></i> Quản lý Category</a>
            <a class="nav-link" th:href="@{/graphql/products}"><i class="bi bi-box-seam me-1"></i> Quản lý Product</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0 text-dark">Quản Lý Danh Mục (GraphQL CRUD)</h3>
            <small class="text-muted">Tìm kiếm, phân trang và thao tác dữ liệu qua GraphQL Query & Mutation</small>
        </div>
        <button class="btn btn-primary fw-semibold shadow-sm" onclick="openAddModal()">
            <i class="bi bi-plus-lg me-1"></i> Thêm Mới Danh Mục
        </button>
    </div>

    <!-- Thanh Tìm kiếm -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" id="keywordInput" class="form-control" placeholder="Nhập tên danh mục cần tìm...">
                    </div>
                </div>
                <div class="col-auto">
                    <button class="btn btn-dark px-3" onclick="search()"><i class="bi bi-search me-1"></i> Tìm kiếm</button>
                    <button class="btn btn-outline-secondary" onclick="resetSearch()">Xóa bộ lọc</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bảng Category -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="text-center" style="width: 90px;">#ID</th>
                            <th>Tên danh mục</th>
                            <th class="text-center" style="width: 140px;">Trạng thái</th>
                            <th class="text-center" style="width: 180px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="categoryTbody">
                        <!-- AJAX Render -->
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Phân trang -->
        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3">
            <span id="pageInfo" class="text-muted small"></span>
            <ul class="pagination mb-0" id="pagination"></ul>
        </div>
    </div>
</div>

<!-- Modal Thêm/Sửa Category -->
<div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold" id="modalTitle">Thêm Danh Mục</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="editCatId">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên danh mục <span class="text-danger">*</span></label>
                    <input type="text" id="catName" class="form-control" placeholder="Nhập tên danh mục..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Trạng thái</label>
                    <select id="catStatus" class="form-select">
                        <option value="1">Hoạt động</option>
                        <option value="0">Đã ẩn</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary px-3" onclick="saveCategory()"><i class="bi bi-save me-1"></i> Lưu lại</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const GRAPHQL_URL = /*[[@{/graphql}]]*/ '/graphql';
    let currentPage = 0;
    const pageSize = 5;

    function executeGraphQL(query, variables = {}) {
        return $.ajax({
            url: GRAPHQL_URL,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query, variables: variables })
        });
    }

    $(document).ready(function() {
        loadPage(0);
    });

    function search() { loadPage(0); }
    function resetSearch() { $('#keywordInput').val(''); loadPage(0); }

    // 1. Phân trang & Tìm kiếm Category
    function loadPage(page) {
        currentPage = page;
        const kw = $('#keywordInput').val();
        const query = `
            query GetCatsPaged($kw: String, $page: Int,$size: Int) {
                categoriesPaged(keyword: $kw, page: $page, size:$size) {
                    content {
                        categoryId
                        categoryname
                        status
                    }
                    totalPages
                    totalElements
                    currentPage
                }
            }
        `;
        executeGraphQL(query, { kw: kw, page: page, size: pageSize }).done(function(res) {
            const data = res.data.categoriesPaged;
            renderTable(data.content);
            renderPagination(data.totalPages, data.currentPage, data.totalElements);
        });
    }

    function renderTable(list) {
        let html = '';
        if (!list || list.length === 0) {
            $('#categoryTbody').html('<tr><td colspan="4" class="text-center py-4 text-muted">Không tìm thấy dữ liệu.</td></tr>');
            return;
        }
        list.forEach(c => {
            const badge = c.status === 1 
                ? '<span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">Hoạt động</span>' 
                : '<span class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1">Đã ẩn</span>';

            html += `
                <tr>
                    <td class="text-center fw-bold text-secondary">#${c.categoryId}</td>
                    <td class="fw-semibold text-dark">${c.categoryname}</td>
                    <td class="text-center">${badge}</td>
                    <td class="text-center">
                        <button class="btn btn-outline-warning btn-sm me-1" onclick="openEditModal(${c.categoryId}, '${c.categoryname}',${c.status})"><i class="bi bi-pencil-square"></i> Sửa</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="deleteCategory(${c.categoryId})"><i class="bi bi-trash"></i> Xóa</button>
                    </td>
                </tr>
            `;
        });
        $('#categoryTbody').html(html);
    }

    function renderPagination(totalPages, curPage, totalElements) {
        $('#pageInfo').text(`Tổng cộng: ${totalElements} danh mục | Trang ${curPage + 1} /${totalPages || 1}`);
        let phtml = '';
        for (let i = 0; i < totalPages; i++) {
            phtml += `<li class="page-item ${i === curPage ? 'active' : ''}"><button class="page-link" onclick="loadPage(${i})">${i + 1}</button></li>`;
        }
        $('#pagination').html(phtml);
    }

    function openAddModal() {
        $('#editCatId').val('');
        $('#catName').val('');
        $('#catStatus').val('1');
        $('#modalTitle').text('Thêm Mới Danh Mục');
        $('#categoryModal').modal('show');
    }

    function openEditModal(id, name, status) {
        $('#editCatId').val(id);
        $('#catName').val(name);
        $('#catStatus').val(status);
        $('#modalTitle').text('Cập Nhật Danh Mục');
        $('#categoryModal').modal('show');
    }

    // 2. Thêm / Sửa qua GraphQL Mutation
    function saveCategory() {
        const id = $('#editCatId').val();
        const name = $('#catName').val();
        const status = parseInt($('#catStatus').val());

        if (!name.trim()) {
            alert('Vui lòng nhập tên danh mục!');
            return;
        }

        if (!id) {
            // Thêm mới (Mutation)
            const mutation = `
                mutation CreateCategory($input: CategoryInput!) {
                    createCategory(input: $input) {
                        categoryId
                        categoryname
                    }
                }
            `;
            executeGraphQL(mutation, { input: { categoryname: name, status: status, images: "default_cate.png" } }).done(function() {
                alert('Thêm danh mục thành công!');
                $('#categoryModal').modal('hide');
                loadPage(0);
            });
        } else {
            // Cập nhật (Mutation)
            const mutation = `
                mutation UpdateCategory($id: ID!,$input: CategoryInput!) {
                    updateCategory(id: $id, input:$input) {
                        categoryId
                        categoryname
                    }
                }
            `;
            executeGraphQL(mutation, { id: id, input: { categoryname: name, status: status } }).done(function() {
                alert('Cập nhật thành công!');
                $('#categoryModal').modal('hide');
                loadPage(currentPage);
            });
        }
    }

    // 3. Xóa qua GraphQL Mutation
    function deleteCategory(id) {
        if (confirm('Bạn có chắc chắn muốn xóa danh mục này?')) {
            const mutation = `
                mutation DeleteCat($id: ID!) {
                    deleteCategory(id: $id)
                }
            `;
            executeGraphQL(mutation, { id: id }).done(function(res) {
                if (res.data.deleteCategory) {
                    alert('Đã xóa thành công!');
                    loadPage(currentPage);
                }
            }).fail(function() {
                alert('Lỗi: Danh mục này có thể đang ràng buộc với sản phẩm!');
            });
        }
    }
</script>
</body>
</html>
