<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - GraphQL AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        .product-card { transition: transform 0.2s, box-shadow 0.2s; border: none; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" th:href="@{/graphql/home}">
            <i class="bi bi-diagram-3-fill me-2"></i> GRAPHQL HOME
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" th:href="@{/graphql/home}"><i class="bi bi-house me-1"></i> Trang Chủ</a>
            <a class="nav-link" th:href="@{/graphql/categories}"><i class="bi bi-folder2-open me-1"></i> Quản lý Category</a>
            <a class="nav-link" th:href="@{/graphql/products}"><i class="bi bi-box-seam me-1"></i> Quản lý Product</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <!-- Card Tiêu đề & Bộ lọc -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <h4 class="fw-bold mb-1 text-dark">Sản Phẩm Trực Tuyến</h4>
                <span class="text-muted small">Dữ liệu được nạp bằng AJAX thông qua GraphQL Endpoint <code>/graphql</code></span>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary shadow-sm" id="btnSortPrice" onclick="loadProductsPriceAsc()">
                    <i class="bi bi-sort-numeric-down me-1"></i> Giá: Thấp đến Cao
                </button>
                <select class="form-select w-auto shadow-sm" id="categoryFilter" onchange="onCategoryChange()">
                    <option value="">-- Lọc theo Danh mục --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Grid Danh sách Sản phẩm -->
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4" id="productList">
        <!-- Render bằng jQuery AJAX từ GraphQL -->
    </div>
</div>

<script th:inline="javascript">
    const GRAPHQL_URL = /*[[@{/graphql}]]*/ '/graphql';
    const CONTEXT_PATH = /*[[@{/}]]*/ '/';

    // Hàm gọi GraphQL chuẩn qua AJAX (HTTP POST JSON)
    function callGraphQL(query, variables = {}) {
        return $.ajax({
            url: GRAPHQL_URL,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query, variables: variables })
        });
    }

    $(document).ready(function() {
        loadCategorySelect();
        loadProductsPriceAsc();
    });

    // Tải danh mục vào dropdown
    function loadCategorySelect() {
        const query = `
            query {
                allCategories {
                    categoryId
                    categoryname
                }
            }
        `;
        callGraphQL(query).done(function(res) {
            let opts = '<option value="">-- Tất cả danh mục (Giá tăng dần) --</option>';
            res.data.allCategories.forEach(c => {
                opts += `<option value="${c.categoryId}">${c.categoryname}</option>`;
            });
            $('#categoryFilter').html(opts);
        });
    }

    // 1. Hiển thị tất cả sản phẩm có price từ thấp đến cao
    function loadProductsPriceAsc() {
        $('#categoryFilter').val('');
        $('#btnSortPrice').addClass('btn-primary').removeClass('btn-outline-primary');

        const query = `
            query {
                productsPriceAsc {
                    productId
                    productName
                    price
                    imageUrl
                    description
                    category {
                        categoryname
                    }
                }
            }
        `;
        callGraphQL(query).done(function(res) {
            renderCards(res.data.productsPriceAsc);
        });
    }

    // 2. Lấy tất cả product của 01 category
    function onCategoryChange() {
        const catId = $('#categoryFilter').val();
        if (!catId) {
            loadProductsPriceAsc();
            return;
        }
        $('#btnSortPrice').removeClass('btn-primary').addClass('btn-outline-primary');

        const query = `
            query GetProdsByCat($catId: ID!) {
                productsByCategory(categoryId: $catId) {
                    productId
                    productName
                    price
                    imageUrl
                    description
                    category {
                        categoryname
                    }
                }
            }
        `;
        callGraphQL(query, { catId: catId }).done(function(res) {
            renderCards(res.data.productsByCategory);
        });
    }

    function renderCards(products) {
        let html = '';
        if (!products || products.length === 0) {
            $('#productList').html('<div class="col-12 text-center text-muted py-5">Không có sản phẩm nào.</div>');
            return;
        }
        products.forEach(p => {
            let imgSrc = '';
            if (p.imageUrl && p.imageUrl.startsWith('http')) {
                imgSrc = p.imageUrl;
            } else if (p.imageUrl && p.imageUrl.trim() !== '') {
                imgSrc = CONTEXT_PATH + 'uploads/' + p.imageUrl;
            } else {
                imgSrc = 'https://via.placeholder.com/200?text=No+Img';
            }

            const catName = p.category ? p.category.categoryname : 'N/A';

            html += `
                <div class="col">
                    <div class="card h-100 shadow-sm product-card">
                        <img src="${imgSrc}" class="card-img-top p-2" style="height: 180px; object-fit: cover;" onerror="this.onerror=null;this.src='https://via.placeholder.com/200?text=No+Img';">
                        <div class="card-body d-flex flex-column">
                            <span class="badge bg-secondary-subtle text-secondary align-self-start mb-2">${catName}</span>
                            <h6 class="card-title fw-bold text-dark">${p.productName}</h6>
                            <p class="card-text text-muted small text-truncate">${p.description || ''}</p>
                            <div class="mt-auto">
                                <span class="fs-5 fw-bold text-danger">${Number(p.price).toLocaleString('vi-VN')} đ</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        $('#productList').html(html);
    }
</script>
</body>
</html>
